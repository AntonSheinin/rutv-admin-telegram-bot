services:
  rutv-admin-bot:
    image: "${RUTV_ADMIN_BOT_IMAGE:-ghcr.io/antonsheinin/rutv-admin-telegram-bot:latest}"
    container_name: rutv-admin-bot
    env_file:
      - .env
    networks:
      - playlist-network
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  playlist-network:
    external: true
    name: "${PLAYLIST_MCP_NETWORK:-playlist_service_playlist-network}"
